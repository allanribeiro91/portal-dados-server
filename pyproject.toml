[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portal-dados-server"
version = "0.1.0"
description = "Backend do Portal de Dados"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2,<3.0",
    "fastapi>=0.116,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
